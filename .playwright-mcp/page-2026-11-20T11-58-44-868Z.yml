    - generic [ref=f1e364]:
      - generic [ref=f1e365]:
        - generic [ref=f1e367]:
          - generic [ref=f1e368]: About Ramayana
          - generic [ref=f1e371]:
            - generic [ref=f1e373]:
              - paragraph [ref=f1e374]:
                - strong [ref=f1e375]: Ramayana
                - text: ", also known as"
                - strong [ref=f1e376]: Namit Malhotra’s Ramayana
                - text: ", is an epic mythological drama directed by Nitesh Tiwari, with Ranbir Kapoor as Lord Rama, Sai Pallavi as Sita, Yash as Ravana and Sunny Deol as Hanumana. Based on the Valmiki Ramayana, it is the first film in a two-part saga produced by Namit Malhotra’s Prime Focus Studios with Yash’s Monster Mind Creations. It has visual effects by Oscar-winning DNEG, a score by A.R. Rahman and Hans Zimmer, and is the first Indian production Filmed for IMAX. Ramayana releases worldwide on"
                - strong [ref=f1e377]: 5 November 2026
                - text: .
              - heading [level=3] [ref=f1e378]:
                - strong [ref=f1e379]: Ramayana Release Date and Advance Booking
              - paragraph [ref=f1e380]: The makers have confirmed that Ramayana opens in cinemas worldwide on 5 November 2026, ahead of Diwali, including premium formats such as IMAX and 4DX 3D. Part 2 follows in Diwali 2028. In India, the film releases in Hindi, Tamil, Telugu, Kannada and Malayalam.
              - paragraph [ref=f1e381]: Early demand has been strong. Advance sales were already building weeks before release in India, and US pre-sales opened ahead of the international launch. With a festive opening and a limited number of IMAX screens in most cities, the best seats, formats and showtimes are likely to go first, so it helps to book early.
              - heading [level=3] [ref=f1e382]:
                - strong [ref=f1e383]: "Ramayana Cast and Characters: Who Plays Whom"
              - paragraph [ref=f1e384]: "The first full trailer confirmed one of the largest ensembles ever assembled for an Indian film. Here is who plays whom in Ramayana:"
              - paragraph [ref=f1e385]:
                - strong [ref=f1e386]: Ayodhya
              - list [ref=f1e387]:
                - listitem [ref=f1e388]: Ranbir Kapoor as Lord Rama
                - listitem [ref=f1e389]: Sai Pallavi as Sita
                - listitem [ref=f1e390]: Ravie Dubey as Lakshmana
                - listitem [ref=f1e391]: Arun Govil as King Dasharatha
                - listitem [ref=f1e392]: Lara Dutta as Kaikeyi
                - listitem [ref=f1e393]: Indira Krishnan as Kaushalya
                - listitem [ref=f1e394]: Sonal Jha as Sumitra
                - listitem [ref=f1e395]: Sheeba Chaddha as Manthara
                - listitem [ref=f1e396]: Adinath Kothare as Bharata
                - listitem [ref=f1e397]: Nitish Sharma as Shatrughna
              - paragraph [ref=f1e398]:
                - strong [ref=f1e399]: Lanka
              - list [ref=f1e400]:
                - listitem [ref=f1e401]: Yash as Ravana
                - listitem [ref=f1e402]: Kajal Aggarwal as Mandodari
                - listitem [ref=f1e403]: Rakul Preet Singh as Shurpanakha
