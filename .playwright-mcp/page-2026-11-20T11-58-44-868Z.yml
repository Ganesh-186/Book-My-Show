                - listitem [ref=f1e417]: Anupam Kher as Jatayu
              - paragraph [ref=f1e418]: For full profiles, see the Ramayana cast and crew section on this page.
              - heading [level=3] [ref=f1e419]:
                - strong [ref=f1e420]: "Arun Govil as King Dasharatha: A Full-Circle Casting"
              - paragraph [ref=f1e421]:
                - text: One of the most talked-about choices in Ramayana is Arun Govil returning as King Dasharatha, Rama’s father. For millions of viewers, Govil
                - emphasis [ref=f1e422]: is
                - text: Lord Ram, thanks to his role in Ramanand Sagar’s much-loved 1987 television series. Seeing him step into the world of the Ramayana as the king of Ayodhya connects two generations of audiences.
              - paragraph [ref=f1e423]: The makers marked the casting with a solo poster, and at the trailer launch in Delhi, the cast paid visible tribute to him on stage, with Ranbir Kapoor touching his feet. For viewers who grew up with the TV series, the casting gives the film an emotional connection before a single scene plays, and it has become a major point of conversation around the release.
              - heading [level=3] [ref=f1e424]:
                - strong [ref=f1e425]: "Ramayana Music: A.R. Rahman and Hans Zimmer"
              - paragraph [ref=f1e426]:
                - text: The film’s soundtrack stands out as one of its biggest highlights. Two-time Oscar winner
                - strong [ref=f1e427]: A.R. Rahman
                - text: ", renowned for"
                - emphasis [ref=f1e428]: Slumdog Millionaire
                - text: ", joins legendary composer"
                - strong [ref=f1e429]: Hans Zimmer
                - text: ", who won Academy Awards for"
                - emphasis [ref=f1e430]: The Lion King
                - text: and
                - emphasis [ref=f1e431]: Dune
                - text: . Zimmer, also acclaimed for scoring blockbusters like
                - emphasis [ref=f1e432]: Inception
                - text: and
                - emphasis [ref=f1e433]: Interstellar
                - text: (which feature visual effects by DNEG), makes his Indian cinema debut with
                - emphasis [ref=f1e434]: Ramayana
                - text: .
              - paragraph [ref=f1e435]: The pairing has drawn attention across the industry and among fans, who see it as a meeting of Rahman’s Indian musical roots and Zimmer’s large-scale orchestral style. Rahman has said the project took close to three and a half years of work and called it the most exciting he has done. Poet Dr. Kumar Vishwas has written lyrics for the songs.
              - paragraph [ref=f1e436]: "What has been released so far:"
              - list [ref=f1e437]:
                - listitem [ref=f1e438]:
                  - strong [ref=f1e439]: Jai Jai Rama
                  - text: ", the first song, composed by A.R. Rahman, sung by Shreya Ghoshal and Arijit Singh, released on Ganesh Chaturthi"
                - listitem [ref=f1e440]:
                  - strong [ref=f1e441]: Ravana Tandav,
                  - text: the second single, released on Dussehra (20 October). Composed by A.R. Rahman and sung by Vishal Dadlani.
                - listitem [ref=f1e442]:
                  - strong [ref=f1e443]: Sita’s Aspiration
                  - text: composed by A.R. Rahman, with vocals by A.R. Ameen, Vaishali Samant, Rakshita Suresh and Antara Nandy.
                - listitem [ref=f1e444]:
                  - strong [ref=f1e445]: Jai Jai Ram (Orchestral),
                  - text: an instrumental version of the title song by Hans Zimmer and A.R. Rahman.
                - listitem [ref=f1e446]:
                  - strong [ref=f1e447]: Rama Theme,
                  - text: a score piece by Hans Zimmer and A.R. Rahman, released earlier in the campaign.
                - listitem [ref=f1e448]:
                  - strong [ref=f1e449]: Mangal Rang,
                  - text: composed by A.R. Rahman and sung by Arijit Singh and Shreya Ghoshal.
              - heading [level=3] [ref=f1e450]:
                - strong [ref=f1e451]: Ramayana Trailer, Posters and Marketing
              - paragraph [ref=f1e452]: The official trailer of Ramayana released globally at 4:15 am IST on 30 July 2026, during Brahma Muhurat, a time traditionally seen as auspicious for new beginnings. The trailer runs about four minutes and was a big talking point for Yash’s entrance as Ravana. Earlier, the film was showcased at San Diego Comic-Con, and an English-language trailer followed in October.
              - paragraph [ref=f1e453]:
                - text: The campaign has leaned on cultural themes. The trailer launch at Bharat Mandapam in New Delhi, titled
                - emphasis [ref=f1e454]: Pratham Sankalp
                - text: ", was staged as a cultural celebration and not a conventional film event, and the ground campaign in India has been called"
                - emphasis [ref=f1e455]: Hamara Satya, Hamara Itihaas
                - text: . Dharma Distribution is handling the release in India and Sony Pictures outside India. Watch the trailer and see the cast posters on this page.
              - heading [level=3] [ref=f1e456]:
                - strong [ref=f1e457]: "Namit Malhotra: The Producer Behind Ramayana"
              - paragraph [ref=f1e458]:
                - strong [ref=f1e459]: Namit Malhotra
                - text: began his career in 1997 by merging his Video Workshop with his father’s film equipment rental business to form Prime Focus. He expanded it globally, and in 2014 merged Prime Focus World with the London-based visual effects studio Double Negative, creating DNEG, where he is CEO. The company has since grown from about 700 to over 8,000 employees. As a producer, his credits include
                - emphasis [ref=f1e460]: "Brahmastra: Part One – Shiva"
                - text: ","
                - emphasis [ref=f1e461]: Fighter
                - text: and
                - emphasis [ref=f1e462]: The Garfield Movie
                - text: .
              - paragraph [ref=f1e463]:
                - text: His vision for Ramayana is to tell one of India’s oldest stories at global scale. He has described the film as mixing fantasy and human drama of the kind seen in
                - emphasis [ref=f1e464]: The Lord of the Rings
                - text: and
                - emphasis [ref=f1e465]: Gladiator
                - text: ", and brought in Hollywood stunt directors Terry Notary and Guy Norris to choreograph the battles. The film has also reportedly assembled over 10,000 crew members worldwide."
              - paragraph [ref=f1e466]:
                - strong [ref=f1e467]: "Why DNEG matters:"
                - text: DNEG has won eight Academy Awards for Best Visual Effects since 2011, for films including
                - emphasis [ref=f1e468]: Inception
                - text: ","
                - emphasis [ref=f1e469]: Interstellar
                - text: ","
                - emphasis [ref=f1e470]: Ex Machina
                - text: ","
                - emphasis [ref=f1e471]: Blade Runner 2049
                - text: ","
                - emphasis [ref=f1e472]: First Man
                - text: ","
                - emphasis [ref=f1e473]: Tenet
                - text: ","
                - emphasis [ref=f1e474]: Dune
                - text: and
                - emphasis [ref=f1e475]: "Dune: Part Two"
                - text: . For Ramayana, that means the film’s mythological worlds, from Ayodhya to Lanka, are being built by the same studio behind some of the most acclaimed visual effects of the past decade.
              - heading [level=3] [ref=f1e476]:
                - strong [ref=f1e477]: Why Watch Ramayana in IMAX? The First Indian Film Filmed for IMAX
              - paragraph [ref=f1e478]:
                - text: Ramayana is the first Indian production to receive the
                - strong [ref=f1e479]: Filmed for IMAX
                - text: label. That means it was shot with IMAX-certified cameras and framed for IMAX screens from the start, not converted afterwards.
              - paragraph [ref=f1e480]:
                - strong [ref=f1e481]: "How IMAX differs from a standard screen:"
              - list [ref=f1e482]:
                - listitem [ref=f1e483]:
                  - strong [ref=f1e484]: "Taller picture:"
                  - text: Standard widescreen is 2.39:1, while IMAX uses a taller 1.90:1 frame, and some screens support the even taller 1.43:1. You see more of the image above and below, which can mean up to around 40% more picture in expanded sequences.
                - listitem [ref=f1e485]:
                  - strong [ref=f1e486]: "Bigger screens and sharper projection:"
                  - text: IMAX auditoriums are built to fill your field of view, and IMAX with Laser offers brighter, higher-contrast images.
                - listitem [ref=f1e487]:
                  - strong [ref=f1e488]: "Sound:"
                  - text: IMAX uses a dedicated multi-channel system designed for deep bass and surround.
              - paragraph [ref=f1e489]:
                - strong [ref=f1e490]: "“Filmed for IMAX” vs “Shot with IMAX”:"
                - text: “Filmed for IMAX” films use IMAX-certified digital cameras, while “Shot with IMAX” refers to films shot with IMAX’s own film cameras, such as Christopher Nolan’s
                - emphasis [ref=f1e491]: The Odyssey
                - text: .
              - paragraph [ref=f1e492]: For a film built around large-scale battles and mythological worlds, IMAX is the format that shows the most of what the makers shot. Presentation varies by theatre, since not every IMAX screen supports the same aspect ratio, so check the format tag on your showtime.
              - heading [level=3] [ref=f1e493]:
                - strong [ref=f1e494]: Book Ramayana Tickets in Chennai
              - paragraph [ref=f1e495]: Book Ramayana tickets on District by choosing the desired cinema, showtime and seats in the format you prefer. The film is available in Hindi, Tamil, Telugu, Kannada, Malayalam and English at select theatres, so check the language and format tags on each showtime before booking. With a festive release, popular showtimes in Chennai can fill quickly.
              - heading [level=3] [ref=f1e496]:
                - strong [ref=f1e497]: Join the Hype for Ramayana
              - paragraph [ref=f1e498]:
                - text: Head over to the Ramayana movie page on District app and tap on
                - strong [ref=f1e499]: Join the Hype
                - text: and choose
                - strong [ref=f1e500]: I’m Hyped
                - text: or
                - strong [ref=f1e501]: I’m Super Hyped
                - text: . District creates a shareable card you can post on social media so friends and family know you’re counting down.
