              - list [ref=f1e411]:
                - listitem [ref=f1e412]: Sunny Deol as Hanumana
                - listitem [ref=f1e413]: Shishir Sharma as Vashishtha
                - listitem [ref=f1e414]: Ajinkya Deo as Vishwamitra
                - listitem [ref=f1e415]: Mukesh Tiwari as Agastya
